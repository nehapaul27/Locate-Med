<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="signup.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <div id="main">
        <div id="header">
             <i class="ri-map-pin-line"></i>
             <p>Locate Med</p>
        </div>
        <div id="fakeheader"></div>

        <div id="page1">
            <div id="box">
                <div id="left-box">
                    <p class="title" id="join-title">JOIN</p>
                    <p class="title" id="locate-title">LOCATE MED</p>
                    <p class="title" id="description-title">create your account and join with us!</p>
                   
                    <div id="write">
                        <h1><i class="ri-shield-check-line"></i>Trust & secure</h1>
                        <p>your data is safe with us</p>
                        <h1><i class="ri-map-pin-line"></i>Find nearby</h1>
                        <p>Locate Medicine  instantly</p>
                        <h1><i class="ri-flashlight-fill"></i>Fast & Reliable</h1>
                        <p>Get accurate information real-time</p>
                    </div>
                </div>

                <div id="right-box">

    <h1>Create Your Account</h1>

    <p id="subtitle">
        Choose your account type to continue
    </p>

    <div id="account-type">

        <button class="card" onclick="window.location.href='signup-user.html'">

            <div class="circle">
                <i class="ri-user-fill"></i>
            </div>

            <h2>Simple User</h2>

            <p>
                I want to find medicines
                and nearby pharmacies.
            </p>

        </button>

        <button class="card" onclick="window.location.href='signup-pharmacist.html'">

            <div class="circle">
                <i class="ri-store-2-fill"></i>
            </div>

            <h2>Pharmacist</h2>

            <p>
                I want to register my pharmacy
                and manage my store.
            </p>

        </button>

    </div>

    <p id="login">
        Already have an account?
        <span onclick="window.location.href='login.html'">Login</span>
    </p>

</div>
            </div>
        </div>

    </div>
</body>
</html>
